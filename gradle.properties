org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- Wispr ----
# App version for local builds. A release tag (v4.2.0) overrides it on GitHub Actions.
wispr.version=4.1.0
# GitHub repo for in-app updates ("owner/name"). Leave empty: GitHub Actions fills it in by itself.
wispr.repo=
# false = no in-app updater (use this for a Google Play build).
wispr.selfUpdate=true
