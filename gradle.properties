org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- Wispr ----
# App version for local builds (Codespaces). A release tag (v4.2.0) overrides it on GitHub Actions.
# IMPORTANT: this MUST be the same number as the GitHub release tag you upload the APK to
# (wispr.version=4.1.4  ->  tag v4.1.4). If it is lower, the app thinks it is old and shows "Update".
wispr.version=4.1.4
# GitHub repo for in-app updates ("owner/name"). Leave empty: GitHub Actions fills it in by itself.
wispr.repo=DeepuExplainsAi/ALWAYSWISPR
# false = no in-app updater (use this for a Google Play build).
wispr.selfUpdate=true
