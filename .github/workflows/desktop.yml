# Push a tag like desktop-v4.1.4 -> installers for Windows, macOS and Linux are added to the release v4.1.4 (next to the APK).
# The Android updater only picks the .apk asset, so extra files on that release are safe.
# Or: Actions -> "Build PC app" -> Run workflow (installers appear under Artifacts).
name: Build PC app

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: wispr-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: files
          merge-multiple: true
      # Everything lives on the normal release page next to the APK: desktop-v4.1.4 -> v4.1.4.
      - name: Upload to the v* release (created if the APK build has not made it yet)
        run: |
          tag="v${GITHUB_REF_NAME#desktop-v}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Wispr $tag" --generate-notes --latest=false
          gh release upload "$tag" files/* --clobber
