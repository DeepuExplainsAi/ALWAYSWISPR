# Push a tag like v3.0.0  ->  GitHub builds the signed APK and puts it on the Releases page.
# Or: Actions tab -> "Build APK and publish release" -> Run workflow (APK appears under Artifacts).
name: Build APK and publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="3.0.0-build.${GITHUB_RUN_NUMBER}"; fi
          echo "WISPR_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "WISPR_VERSION_CODE=$((300 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Signing key (from GitHub Secrets)
        env:
          KS_B64: ${{ secrets.WISPR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/wispr.jks"
            echo "WISPR_KEYSTORE=$RUNNER_TEMP/wispr.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::WISPR_KEYSTORE_BASE64 secret not set. APK will be signed with a temporary debug key, so users can't update over it later."
          fi

      - name: Build release APK
        env:
          WISPR_KEYSTORE_PASSWORD: ${{ secrets.WISPR_KEYSTORE_PASSWORD }}
          WISPR_KEY_ALIAS: ${{ secrets.WISPR_KEY_ALIAS }}
          WISPR_KEY_PASSWORD: ${{ secrets.WISPR_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Wispr-by-Deepu-Gupta-v${WISPR_VERSION_NAME}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v6
        with:
          name: Wispr-by-Deepu-Gupta-apk
          path: dist/*

      - name: Publish on the Releases page
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Wispr by Deepu Gupta ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
